# XcodeGen spec for the Best Card Picker iPhone app.
# Regenerate the project after editing: cd ios && xcodegen generate
# (The generated BestCardPicker.xcodeproj is committed, so Xcode alone works.)
name: BestCardPicker
options:
  bundleIdPrefix: com.davidxie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    # Free Apple ID signing. The team ID comes from the gitignored
    # Local.xcconfig (see Signing.xcconfig); never put it in this file.
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  BestCardEngine:
    path: Packages/BestCardEngine
targets:
  BestCardPicker:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: BestCardEngine
        product: BestCardEngine
      - package: BestCardEngine
        product: CardPickerCore
      - target: BestCardWidget
        embed: true
    preBuildScripts:
      - name: Sync shared data (data/*.json)
        script: "\"$SRCROOT/scripts/sync-shared-data.sh\""
        basedOnDependencyAnalysis: false
    entitlements:
      path: App/BestCardPicker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.davidxie.bestcardpicker
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Card Picker
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "Finds the store you're in so it can name the best card. MapKit lookups send your location to Apple; turn on Offline mode to stop them."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Only used for saved place alerts: tells you which card to use when you arrive at a saved store, even with the app closed."
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleURLTypes:
          - CFBundleURLName: com.davidxie.bestcardpicker
            CFBundleURLSchemes: [bestcard]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Card rules (cards.json)
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidxie.bestcardpicker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Card Picker
  BestCardWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    dependencies:
      - package: BestCardEngine
        product: CardPickerCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widget/BestCardWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.davidxie.bestcardpicker
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Card Picker
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidxie.bestcardpicker.widget
  BestCardPickerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: BestCardPicker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.davidxie.bestcardpicker.tests
  BestCardPickerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BestCardPicker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.davidxie.bestcardpicker.uitests
        TEST_TARGET_NAME: BestCardPicker
schemes:
  BestCardPicker:
    build:
      targets:
        BestCardPicker: all
        BestCardWidget: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - BestCardPickerTests
        - BestCardPickerUITests
        - package: BestCardEngine/BestCardEngineTests
        - package: BestCardEngine/CardPickerCoreTests
  BestCardEngine:
    build:
      targets:
        BestCardPicker: [test]
    test:
      targets:
        - package: BestCardEngine/BestCardEngineTests
        - package: BestCardEngine/CardPickerCoreTests
