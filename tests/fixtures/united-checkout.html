<!doctype html>
<!-- Test fixture. Served by Playwright at https://www.united.com/en/us/checkout/payment. Hand-written stand-in for a real checkout page; no personal data. -->
<html lang="en-US"><head><meta charset="utf-8"><title>Payment | United Airlines</title><style>body{font-family:Arial,sans-serif;margin:0;padding:24px;min-height:1400px}main{max-width:900px}.field{display:block;margin:8px 0}.bottom-right{position:fixed;right:16px;bottom:16px;width:360px;background:#eee;padding:8px}</style></head>
<body><main>

<h1>Trip total: $412.30</h1>
<form id="pay" autocomplete="on" onsubmit="return false">
  <label class="field">Name on card <input id="ccname" autocomplete="cc-name" name="ccname"></label>
  <label class="field">Card number <input id="ccnumber" autocomplete="cc-number" inputmode="numeric" name="cardnumber"></label>
  <label class="field">Expiration <input id="ccexp" autocomplete="cc-exp" name="exp"></label>
  <label class="field">Security code <input id="cccsc" autocomplete="cc-csc" name="cvc"></label>
  <button type="submit">Complete purchase</button>
</form>

</main></body></html>
